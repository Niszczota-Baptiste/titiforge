[package]
name = "tf-world"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Monde résident : adressage, streaming plafonné en octets, staging, annulation"

[dependencies]
tf-anvil.workspace = true
tf-nbt.workspace = true

# tf-anvil est déjà une dépendance, mais un test d'intégration est un crate
# à part : il ne voit que l'API publique du crate testé et ses dev-dependencies.
[dev-dependencies]
tf-anvil.workspace = true
# Le générateur de régions, pour boucler la chaîne complète dans un test :
# opérer sur un vrai `.mca`, enregistrer, annuler, comparer octet pour octet.
# `tf-bench` ne dépend pas de `tf-world` — pas de cycle.
tf-bench = { path = "../tf-bench" }
