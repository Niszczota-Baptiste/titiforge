[package]
name = "tf-mesh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Maillage : passe gloutonne, passe de modèles, occlusion ambiante"

[dependencies]
tf-anvil.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["parallele"]
parallele = ["dep:rayon"]

[dev-dependencies]
tf-bench = { path = "../tf-bench" }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "maillage"
harness = false
