[package]
name = "tf-ops"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Les opérations d'édition : masques, motifs, et la répartition à trois étages"

[dependencies]
tf-anvil.workspace = true
tf-blocks.workspace = true
tf-world.workspace = true
tf-nbt.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["parallele"]
parallele = ["dep:rayon"]

[dev-dependencies]
tf-bench = { path = "../tf-bench" }
# Pour le seul exemple `editer` : les règles de rotation se DÉRIVENT d'un pack,
# elles ne sont pas écrites. Le crate n'en dépend pas — une opération reçoit sa
# règle par injection, ce qui la laisse testable sans pack.
tf-assets = { path = "../tf-assets" }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "etages"
harness = false

[[bench]]
name = "edition"
harness = false
